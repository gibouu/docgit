name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".claude/**"
      - ".clawpatch/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".claude/**"
      - ".clawpatch/**"

# Cancel superseded runs on the same ref — rapid pushes no longer stack billable
# runs (only the latest finishes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Linux is ~10x cheaper than macOS. DocGit is an Electron/Node app — build,
    # typecheck, tests, and the headless boot smoke all run on Linux. macOS is
    # only needed to package/notarize the .dmg, which lives in release.yml
    # (tag-triggered, infrequent). Electron needs a virtual display on Linux,
    # so the smoke runs under xvfb (preinstalled on ubuntu-latest).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Audit the FULL dependency tree (not --prod) — for an Electron app the
      # shipped runtime + packaging deps live under devDependencies, so a
      # production-only audit under-reports. Known advisories are waived with
      # rationale in package.json (pnpm.auditConfig, see #149); a new moderate+
      # advisory fails the build.
      - run: pnpm audit --audit-level moderate
      - run: pnpm build
      - run: pnpm typecheck
      # `pnpm test` runs every package's real tests, including the desktop
      # package's full-stack Electron smoke + boot check (node:sqlite, core
      # engine, document service, renderer load). Under xvfb so the headless
      # Electron run has a virtual display on Linux.
      - run: xvfb-run -a pnpm test
