name: Release

# Push a tag like v0.8.0 to build DocGit.app on an Apple-silicon runner and
# attach the signed + notarized DMG to a GitHub Release. Signing is REQUIRED:
# the release fails fast if the Developer ID secrets are missing, so a tagged
# build can never silently ship an unsigned, Gatekeeper-blocked app.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Require signing + notarization credentials
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ] || [ -z "$APPLE_ID" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::Release aborted — signing/notarization secrets (CSC_LINK, APPLE_ID, APPLE_TEAM_ID) are not set. Refusing to publish an unsigned build that the README promises is notarized."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @docgit/desktop smoke
      - run: pnpm --filter @docgit/desktop dist
        env:
          # Code signing + notarization — required (guarded above). electron-builder
          # signs + notarizes with the Developer ID when these are present.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Create release with DMG + update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "DocGit ${GITHUB_REF_NAME}" \
            --generate-notes \
            apps/desktop/release/*.dmg \
            apps/desktop/release/*.zip \
            apps/desktop/release/*.zip.blockmap \
            apps/desktop/release/latest-mac.yml
