appId: com.kuzog.docgit
productName: DocGit
directories:
  output: release
  buildResources: build
# The main/preload/renderer bundles are fully self-contained (zero native
# deps, workspace + runtime deps bundled by electron-vite) — nothing from
# node_modules needs packing.
files:
  - out/**/*
  - package.json
npmRebuild: false
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  target:
    - target: dir
    - target: dmg
  # Signing is automatic when a "Developer ID Application" certificate is
  # available (login keychain locally, CSC_LINK/CSC_KEY_PASSWORD env in CI);
  # without one, electron-builder warns and produces an unsigned build.
  hardenedRuntime: true
  gatekeeperAssess: false
  # Notarization runs when APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
  # APPLE_TEAM_ID are set in the environment; skipped otherwise.
  notarize: true
dmg:
  title: DocGit
